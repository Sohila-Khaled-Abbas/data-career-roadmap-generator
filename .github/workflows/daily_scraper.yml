name: Daily Job Market Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-market-scraper
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate API credential availability
        id: credential
        shell: bash
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY repository secret is missing; preserving existing datasets."
            echo "No market data refresh: configure repository secret GEMINI_API_KEY." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.credential.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.credential.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow google-genai scrapling curl_cffi browserforge python-dotenv

      - name: Compile pipeline
        if: steps.credential.outputs.enabled == 'true'
        run: python -m compileall -q web/api/src

      - name: Scrape, extract skills and generate data
        if: steps.credential.outputs.enabled == 'true'
        run: python web/api/src/scraper_pipeline.py

      - name: Validate market snapshots
        if: steps.credential.outputs.enabled == 'true'
        shell: bash
        run: |
          test -s web/api/data/egypt_data_skills.parquet
          test -s web/api/data/egypt_data_skills.db

      - name: Commit updated public market datasets
        if: steps.credential.outputs.enabled == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Root data/*.parquet and *.db are intentionally ignored, only commit API snapshot.
          git add web/api/data/egypt_data_skills.parquet web/api/data/egypt_data_skills.db
          if git diff --cached --quiet; then
            echo "No dataset changes to commit." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "data: refresh job market skills snapshot"
            git push
          fi
