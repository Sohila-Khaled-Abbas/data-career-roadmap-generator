name: API offline smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r web/api/requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q web/api/src tests
      - name: Run offline regression tests
        env:
          GEMINI_API_KEY: ""
        run: python -m unittest discover -s tests -v
